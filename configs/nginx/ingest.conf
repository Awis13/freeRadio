daemon off;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application ingest {
            live on;
            record off;

            # Allow multiple subscribers (feed_fifo + feed_audio read the same stream)
            allow play all;

            # Notify dashboard on OBS connect/disconnect
            on_publish http://dashboard:9090/api/live/on_publish;
            on_done http://dashboard:9090/api/live/on_done;

            # Drop publishing clients that idle too long
            drop_idle_publisher 15s;
        }
    }
}
