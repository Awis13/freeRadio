services:
  # 0. Audio Analyzer (Essentia) - beat detection, structure analysis, mix points
  audio-analyzer:
    image: mtgupf/essentia:latest
    container_name: s23-audio-analyzer
    entrypoint: python3
    command: /scripts/audio_analyzer_simple.py
    volumes:
      - ./content/music:/music
      - ./scripts:/scripts:ro
    restart: unless-stopped

  # 1. Аудио-сервер
  icecast:
    image: infiniteproject/icecast
    container_name: s23-icecast
    ports:
      - "8000:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD}
      - ICECAST_ADMIN_PASSWORD=${ICECAST_ADMIN_PASSWORD}
      - ICECAST_PASSWORD=${ICECAST_PASSWORD}
      - ICECAST_RELAY_PASSWORD=${ICECAST_RELAY_PASSWORD}
    networks:
      - rave-net
    restart: unless-stopped

  # 2. DJ (Liquidsoap)
  dj:
    image: savonet/liquidsoap:v2.3.0
    container_name: s23-dj
    environment:
      - OCAMLRUNPARAM=l=32M
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD}
    user: root
    entrypoint: liquidsoap
    command: /config/radio_bpm.liq
    volumes:
      - ./configs/liquidsoap:/config:ro
      - ./content/music:/music:ro
      - shared-data:/shared
    networks:
      - rave-net
    depends_on:
      - icecast
    restart: unless-stopped

  # 2.5 RTMP Ingest (nginx-rtmp) — accepts OBS/external RTMP for Live mode
  rtmp-ingest:
    image: alfg/nginx-rtmp
    container_name: s23-rtmp-ingest
    entrypoint: ["nginx"]
    command: ["-c", "/config/ingest.conf"]
    ports:
      - "1935:1935"
    volumes:
      - ./configs/nginx/ingest.conf:/config/ingest.conf:ro
    networks:
      - rave-net
    restart: unless-stopped

  # 3. Стример (FFMPEG → HLS или RTMP + multi-streaming)
  streamer:
    build:
      context: .
      dockerfile: Dockerfile.streamer
    image: s23-streamer
    container_name: s23-streamer
    entrypoint: /scripts/stream_entry.sh
    group_add:
      - "105"
    environment:
      - OUTPUT_MODE=${OUTPUT_MODE:-hls}
      - RTMP_URL=${RTMP_URL:-}
      - ICECAST_URL=http://icecast:8000/live
      - MAX_CLIP_DURATION=${MAX_CLIP_DURATION:-60}
      - HLS_DIR=/hls
      - HLS_PLAYLIST=/hls/stream.m3u8
      - HLS_LIST_SIZE=6
      - HLS_TIME=4
      - HLS_DELETE_SEGMENTS=1
      - STABLE_LOOP=1
      - FFMPEG_PROGRESS_FILE=/shared/ffmpeg_progress.txt
      - DASHBOARD_API=http://dashboard:9090
      - HW_ACCEL=qsv
    volumes:
      - /dev/dri:/dev/dri
      - ./content/visuals:/visuals:ro
      - ./scripts:/scripts:ro
      - hls-data:/hls
      - shared-data:/shared
    mem_limit: 1536m
    networks:
      - rave-net
    depends_on:
      - icecast
      - dj
      - rtmp-ingest
    restart: unless-stopped

  # 3.5 Transcoder — автоматическая конвертация видео из incoming в готовый формат
  transcoder:
    image: linuxserver/ffmpeg:latest
    container_name: s23-transcoder
    entrypoint: /scripts/transcoder.sh
    group_add:
      - "105"
    volumes:
      - /dev/dri:/dev/dri
      - ./content/visuals:/visuals
      - ./content/music:/music
      - ./scripts:/scripts:ro
    mem_limit: 512m
    networks:
      - rave-net
    restart: unless-stopped

  # 4. Dashboard (Node.js — preview + API + WebSocket)
  # Dashboard UI
  dashboard:
    build: ./dashboard
    container_name: s23-dashboard
    ports:
      - "80:9090"
      - "443:9443"
    environment:
      - PORT=9090
      - TLS_PORT=9443
      - TLS_CERT=/certs/tls.crt
      - TLS_KEY=/certs/tls.key
      - HLS_DIR=/hls
      - MUSIC_DIR=/music
      - VISUALS_DIR=/visuals
      - OUTPUT_MODE=${OUTPUT_MODE:-hls}
      - MAX_PLATFORMS=${MAX_PLATFORMS:-3}
      - FFMPEG_PROGRESS_FILE=/shared/ffmpeg_progress.txt
      - STREAM_KEYS_SECRET=${STREAM_KEYS_SECRET}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN}
      - S3_ENABLED=${S3_ENABLED:-false}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-studio23}
      - S3_REGION=${S3_REGION:-eu-central-1}
      - TENANT_ID=${TENANT_ID:-default}
      - S3_CACHE_MAX_MB=${S3_CACHE_MAX_MB:-4000}
    volumes:
      - ./content/music:/music
      - ./content/visuals:/visuals
      - hls-data:/hls:ro
      - shared-data:/shared
      - ./certs:/certs:ro
    networks:
      - rave-net
    depends_on:
      - icecast
      - streamer
    restart: unless-stopped

volumes:
  hls-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m
  shared-data:

networks:
  rave-net:
    driver: bridge
