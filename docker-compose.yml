services:
  # 0. Audio Analyzer (Essentia) - beat detection, structure analysis, mix points
  audio-analyzer:
    # Pinned 2026-08-02. mtgupf/essentia has NO versioned tag equal to latest:
    # its version tags (bullseye-v2.1_beta5 and friends) are older builds, and
    # latest carries a digest of its own, last pushed 2021-09-02. A digest is
    # therefore the only honest pin available. Resolved with the Docker Hub API
    # and cross-checked with `docker manifest inspect --verbose`.
    image: mtgupf/essentia@sha256:9dd13650cb5fd3aac96d10c152ba1b440a1778705cca017df5c5f651e4765953
    container_name: s23-audio-analyzer
    entrypoint: python3
    command: /scripts/audio_analyzer_simple.py
    volumes:
      - ./content/music:/music
      - ./scripts:/scripts:ro
    restart: unless-stopped

  # 1. Audio server
  icecast:
    # Pinned 2026-08-02. This repository publishes exactly ONE tag — 'latest',
    # last pushed 2020-04-18 — so there is no version to pin to and the digest
    # is the only thing that identifies the image. It was previously untagged,
    # i.e. implicitly :latest.
    image: infiniteproject/icecast@sha256:cd506cf3dfe31ce05fd37d7e672dbd1213e7255cc93d28ecf5a3b547af4e162c
    container_name: s23-icecast
    ports:
      - "8000:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD}
      - ICECAST_ADMIN_PASSWORD=${ICECAST_ADMIN_PASSWORD}
      - ICECAST_PASSWORD=${ICECAST_PASSWORD}
      - ICECAST_RELAY_PASSWORD=${ICECAST_RELAY_PASSWORD}
    # The status page the dashboard already polls (lib/icecast.js). Verified
    # against the image: it is Alpine-based and ships busybox wget at
    # /usr/bin/wget (it has NO curl), and busybox wget exits non-zero on a
    # non-200, so this fails when icecast is up but not serving.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/status-json.xsl"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rave-net
    restart: unless-stopped

  # 2. DJ (Liquidsoap)
  dj:
    image: savonet/liquidsoap:v2.3.0
    container_name: s23-dj
    environment:
      - OCAMLRUNPARAM=l=32M
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD}
    user: root
    entrypoint: liquidsoap
    command: /config/radio_bpm.liq
    volumes:
      - ./configs/liquidsoap:/config:ro
      - ./content/music:/music:ro
      - shared-data:/shared
    networks:
      - rave-net
    depends_on:
      - icecast
    restart: unless-stopped

  # 2.5 RTMP Ingest (nginx-rtmp) — accepts OBS/external RTMP for Live mode
  rtmp-ingest:
    # Pinned 2026-08-02: v1.6.0 is byte-identical to latest (same digest, both
    # pushed 2022-09-04), so this is the same image under a name that cannot
    # move. Was untagged, i.e. implicitly :latest.
    image: alfg/nginx-rtmp:v1.6.0
    container_name: s23-rtmp-ingest
    entrypoint: ["nginx"]
    command: ["-c", "/config/ingest.conf"]
    ports:
      - "1935:1935"
    volumes:
      - ./configs/nginx/ingest.conf:/config/ingest.conf:ro
    # ingest.conf declares an rtmp block ONLY — no http listener exists here, so
    # there is nothing to GET. A TCP probe of the actual RTMP port is the real
    # check; `nginx -t` would merely re-read the config file and pass whether or
    # not anything was listening. Verified in the image: busybox nc is at
    # /usr/bin/nc and its -z discriminates (tested against a live listener and a
    # closed port).
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1935"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rave-net
    restart: unless-stopped

  # 3. Streamer (FFMPEG → HLS or RTMP + multi-streaming)
  streamer:
    build:
      context: .
      dockerfile: Dockerfile.streamer
    image: s23-streamer
    container_name: s23-streamer
    entrypoint: /scripts/stream_entry.sh
    environment:
      - OUTPUT_MODE=${OUTPUT_MODE:-hls}
      - RTMP_URL=${RTMP_URL:-}
      - ICECAST_URL=http://icecast:8000/live
      - MAX_CLIP_DURATION=${MAX_CLIP_DURATION:-60}
      - HLS_DIR=/hls
      - HLS_PLAYLIST=/hls/stream.m3u8
      - HLS_LIST_SIZE=6
      - HLS_TIME=4
      - HLS_DELETE_SEGMENTS=1
      - STABLE_LOOP=1
      - FFMPEG_PROGRESS_FILE=/shared/ffmpeg_progress.txt
      - DASHBOARD_API=http://dashboard:9090
      # Software encode by default. stream_entry.sh already branches on this:
      # 'qsv' selects h264_qsv, anything else (including empty) falls through to
      # libx264. The QSV path additionally needs /dev/dri and the host's render
      # group, which are host-specific and used to be hard-wired here — a host
      # without /dev/dri could not start the service at all, and GID 105 is only
      # the render group on some distributions. Both now live in
      # docker-compose.hwaccel.yml; see .env.example.
      - HW_ACCEL=${HW_ACCEL:-}
    volumes:
      - ./content/visuals:/visuals:ro
      - ./scripts:/scripts:ro
      - hls-data:/hls
      - shared-data:/shared
    mem_limit: 1536m
    networks:
      - rave-net
    depends_on:
      - icecast
      - dj
      - rtmp-ingest
    restart: unless-stopped

  # 4. Dashboard API (Node.js — API + WebSocket + HLS)
  dashboard:
    build: ./dashboard
    container_name: s23-api
    environment:
      - PORT=9090
      - HLS_DIR=/hls
      - MUSIC_DIR=/music
      - VISUALS_DIR=/visuals
      - OUTPUT_MODE=${OUTPUT_MODE:-hls}
      - MAX_PLATFORMS=${MAX_PLATFORMS:-3}
      - FFMPEG_PROGRESS_FILE=/shared/ffmpeg_progress.txt
      - STREAM_KEYS_SECRET=${STREAM_KEYS_SECRET}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN}
      - S3_ENABLED=${S3_ENABLED:-false}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-studio23}
      - S3_REGION=${S3_REGION:-eu-central-1}
      - TENANT_ID=${TENANT_ID:-default}
      - S3_CACHE_MAX_MB=${S3_CACHE_MAX_MB:-4000}
      - TRANSCODER_URL=${TRANSCODER_URL:-}
      - TRANSCODER_TOKEN=${TRANSCODER_TOKEN:-}
    volumes:
      - ./content/music:/music
      - ./content/visuals:/visuals
      - hls-data:/hls:ro
      - shared-data:/shared
    networks:
      - rave-net
    depends_on:
      - icecast
      - streamer
    restart: unless-stopped

  # 5. TLS proxy (nginx) — HTTP + HTTPS -> dashboard
  proxy:
    # Pinned 2026-08-02: 'alpine' is a moving tag that today resolves to the
    # same image as 1.31.3-alpine3.24 (identical layer set, pushed 2026-07-18).
    # Not on the ticket's list of four, but it floats exactly like the rest.
    image: nginx:1.31.3-alpine3.24
    container_name: s23-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    networks:
      - rave-net
    depends_on:
      - dashboard
    restart: unless-stopped

volumes:
  hls-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m
  shared-data:

networks:
  rave-net:
    driver: bridge
