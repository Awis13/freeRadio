<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STUDIO 23 Preview</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b0f14; color: #d7e1ea; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      header { padding: 16px; border-bottom: 1px solid #1c2631; background: linear-gradient(180deg, #0f1620, #0b0f14); position: sticky; top: 0; }
      .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .tag { padding: 2px 8px; border: 1px solid #243244; border-radius: 999px; color: #9fb6cc; }
      main { padding: 16px; max-width: 1100px; margin: 0 auto; }
      video { width: 100%; background: #000; border: 1px solid #1c2631; border-radius: 10px; }
      .hint { margin-top: 12px; color: #9fb6cc; }
      code { color: #c4ffcb; }
      a { color: #9ad0ff; }
      .err { margin-top: 12px; color: #ffb3b3; white-space: pre-wrap; }
      .status { margin-top: 12px; color: #cfd8e3; white-space: pre-wrap; }
      .dbg { margin-top: 12px; border: 1px solid #1c2631; border-radius: 10px; overflow: hidden; }
      .dbg-head { display: flex; gap: 12px; align-items: center; padding: 10px 12px; background: #0f1620; border-bottom: 1px solid #1c2631; }
      .dbg-head button { background: #132031; color: #d7e1ea; border: 1px solid #243244; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
      .dbg-head button:hover { background: #172a41; }
      .dbg-body { padding: 10px 12px; background: #0b0f14; }
      .log { margin: 0; max-height: 320px; overflow: auto; white-space: pre-wrap; color: #cfd8e3; }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <div class="tag">STUDIO 23</div>
        <div class="tag">dry-run</div>
        <div class="tag">HLS</div>
        <div>Open <code>/hls/stream.m3u8</code> (Safari plays HLS natively).</div>
      </div>
    </header>
    <main>
      <video id="player" controls autoplay playsinline muted></video>
      <div class="hint">
        URL: <a href="/hls/stream.m3u8">/hls/stream.m3u8</a>
      </div>
      <div id="status" class="status"></div>
      <div id="err" class="err" hidden></div>
      <div class="dbg">
        <div class="dbg-head">
          <div class="tag">debug</div>
          <button id="clear" type="button">Clear</button>
          <button id="copy" type="button">Copy</button>
          <button id="pause" type="button">Pause logs</button>
          <div class="hint">Chrome: if it stalls, paste this log.</div>
        </div>
        <div class="dbg-body">
          <pre id="log" class="log"></pre>
        </div>
      </div>
    </main>
    <script>
      (function () {
        const video = document.getElementById("player");
        const errEl = document.getElementById("err");
        const statusEl = document.getElementById("status");
        const logEl = document.getElementById("log");
        const clearBtn = document.getElementById("clear");
        const copyBtn = document.getElementById("copy");
        const pauseBtn = document.getElementById("pause");
        const srcPath = "/hls/stream.m3u8";
        const src = new URL(srcPath, window.location.origin).toString();

        const logs = [];
        let logsPaused = false;
        let lastMediaSeq = null;

        function setStatus(msg) {
          statusEl.textContent = msg;
        }

        function log(line) {
          const ts = new Date().toISOString();
          const s = "[" + ts + "] " + line;
          logs.push(s);
          if (logs.length > 800) logs.shift();
          if (logsPaused) return;
          logEl.textContent = logs.join("\n");
          logEl.scrollTop = logEl.scrollHeight;
        }

        function showErr(msg) {
          errEl.hidden = false;
          errEl.textContent = msg;
          log("ERROR_UI " + msg);
        }

        setStatus("Loading player...");
        const ua = navigator.userAgent || "";
        const vendor = navigator.vendor || "";
        log("page loaded; src=" + src + "; ua=" + ua + "; vendor=" + vendor);

        clearBtn.addEventListener("click", function () {
          logs.length = 0;
          logEl.textContent = "";
        });
        pauseBtn.addEventListener("click", function () {
          logsPaused = !logsPaused;
          pauseBtn.textContent = logsPaused ? "Resume logs" : "Pause logs";
          if (!logsPaused) {
            logEl.textContent = logs.join("\n");
            logEl.scrollTop = logEl.scrollHeight;
          }
        });
        copyBtn.addEventListener("click", async function () {
          try {
            await navigator.clipboard.writeText(logs.join("\n"));
            log("copied logs to clipboard");
          } catch (e) {
            showErr("Failed to copy logs: " + e);
          }
        });

        function fmtBuffered() {
          try {
            const b = video.buffered;
            const out = [];
            for (let i = 0; i < b.length; i++) out.push(b.start(i).toFixed(2) + ".." + b.end(i).toFixed(2));
            return out.join(" | ") || "(none)";
          } catch (_) {
            return "(n/a)";
          }
        }

        function videoStateLine() {
          return [
            "ct=" + (video.currentTime || 0).toFixed(2),
            "dur=" + (isFinite(video.duration) ? video.duration.toFixed(2) : "inf"),
            "rs=" + video.readyState,
            "ns=" + video.networkState,
            "paused=" + video.paused,
            "ended=" + video.ended,
            "wh=" + (video.videoWidth || 0) + "x" + (video.videoHeight || 0),
            "buf=" + fmtBuffered()
          ].join(" ");
        }

        [
          "loadstart","loadedmetadata","loadeddata","canplay","canplaythrough",
          "play","playing","pause","waiting","stalled","suspend","seeking","seeked",
          "timeupdate","ended","error","emptied","durationchange","progress"
        ].forEach(function (ev) {
          video.addEventListener(ev, function () {
            let extra = "";
            if (ev === "error" && video.error) extra = " code=" + video.error.code;
            log("video:" + ev + extra + " " + videoStateLine());
          });
        });

        // Detect "stuck" playback (no time progression while not paused).
        let lastCT = 0;
        let lastAdvanceAt = Date.now();
        setInterval(function () {
          const ct = video.currentTime || 0;
          const now = Date.now();
          const advanced = Math.abs(ct - lastCT) > 0.05;
          if (advanced) {
            lastCT = ct;
            lastAdvanceAt = now;
          } else {
            const shouldMove = !video.paused && !video.ended && video.readyState >= 2;
            if (shouldMove && now - lastAdvanceAt > 6000) {
              log("STALL " + videoStateLine());
              lastAdvanceAt = now; // rate-limit stall logs
            }
          }

          // Keep a concise status panel updated.
          setStatus(
            "src=" + src + "\n" +
            videoStateLine() + "\n" +
            "lastMediaSeq=" + (lastMediaSeq === null ? "n/a" : String(lastMediaSeq))
          );
        }, 500);

        // Poll playlist to confirm it advances from the browser POV.
        async function pollPlaylist() {
          try {
            const r = await fetch(src, { cache: "no-store" });
            const text = await r.text();
            const m = text.match(/#EXT-X-MEDIA-SEQUENCE:(\d+)/);
            if (m) {
              const seq = Number(m[1]);
              if (lastMediaSeq === null) {
                lastMediaSeq = seq;
                log("playlist seq=" + seq);
              } else if (seq !== lastMediaSeq) {
                log("playlist seq advance " + lastMediaSeq + " -> " + seq);
                lastMediaSeq = seq;
              }
            } else {
              log("playlist: no MEDIA-SEQUENCE; head=" + JSON.stringify(text.slice(0, 120)));
            }
          } catch (e) {
            log("playlist fetch failed: " + e);
          }
          setTimeout(pollPlaylist, 2000);
        }
        pollPlaylist();

        // Use native HLS only on real Safari/iOS Safari.
        // Chrome sometimes returns "maybe" for canPlayType(mpegurl) but still cannot play it.
        const isIOS = /iPad|iPhone|iPod/.test(ua);
        const isSafariDesktop =
          vendor === "Apple Computer, Inc." &&
          /Safari\//.test(ua) &&
          !/Chrome\/|Chromium\/|Edg\/|OPR\/|CriOS\/|FxiOS\//.test(ua);
        const useNativeHls = isIOS || isSafariDesktop;

        if (useNativeHls) {
          setStatus("Mode: native HLS (Safari)");
          log("mode=native-hls");
          video.src = src;
          video.play().catch(function (e) { showErr("Autoplay blocked: " + e); });
          return;
        }

        // Chrome/Firefox: use hls.js (served locally from nginx).
        const s = document.createElement("script");
        s.src = "/js/hls.min.js";
        s.async = true;
        s.onload = function () {
          if (!window.Hls) {
            showErr("hls.js failed to load (window.Hls missing). Run: docker compose ... --profile tools run --rm fetch-hlsjs");
            return;
          }
          if (!window.Hls.isSupported()) {
            showErr("This browser does not support MediaSource/HLS playback. Try Safari.");
            return;
          }
          setStatus("Mode: hls.js (Chrome/Firefox)\nLoading manifest...");
          log("mode=hls.js; hls.js=" + (window.Hls.version || "?"));
          const hls = new window.Hls({
            lowLatencyMode: false,
            backBufferLength: 30,
            enableWorker: true,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 10,
            liveDurationInfinity: true,
            maxBufferLength: 20,
            maxMaxBufferLength: 40,
            maxFragLookUpTolerance: 0.2,
            liveSyncPosition: -1
          });
          window.__hls = hls;
          hls.on(window.Hls.Events.ERROR, function (_, data) {
            const url = data && data.url ? (" url=" + data.url) : "";
            const code = data && data.response && data.response.code ? (" code=" + data.response.code) : "";
            const msg = "hls:error fatal=" + (data && data.fatal) + " type=" + (data && data.type) + " details=" + (data && data.details) + code + url;
            log(msg);
            if (data && data.fatal) showErr(msg);
          });
          [
            window.Hls.Events.MEDIA_ATTACHED,
            window.Hls.Events.MANIFEST_LOADING,
            window.Hls.Events.MANIFEST_LOADED,
            window.Hls.Events.MANIFEST_PARSED,
            window.Hls.Events.BUFFER_CREATED,
            window.Hls.Events.BUFFER_APPENDING,
            window.Hls.Events.BUFFER_APPENDED,
            window.Hls.Events.LEVEL_SWITCHING,
            window.Hls.Events.LEVEL_SWITCHED,
            window.Hls.Events.FRAG_LOADING,
            window.Hls.Events.FRAG_LOADED,
            window.Hls.Events.FRAG_LOAD_PROGRESS,
            window.Hls.Events.FRAG_BUFFERED,
            window.Hls.Events.FRAG_CHANGED
          ].forEach(function (ev) {
            hls.on(ev, function (_, data) {
              if (ev === window.Hls.Events.FRAG_LOADING || ev === window.Hls.Events.FRAG_LOADED) {
                const u = data && data.frag && data.frag.url ? data.frag.url : "";
                const sn = data && data.frag && typeof data.frag.sn === "number" ? data.frag.sn : "?";
                log("hls:" + ev + " sn=" + sn + " " + u);
                return;
              }
              if (ev === window.Hls.Events.FRAG_LOAD_PROGRESS) {
                const sn = data && data.frag && typeof data.frag.sn === "number" ? data.frag.sn : "?";
                const loaded = data && typeof data.loaded === "number" ? data.loaded : "?";
                const total = data && typeof data.total === "number" ? data.total : "?";
                log("hls:" + ev + " sn=" + sn + " " + loaded + "/" + total);
                return;
              }
              log("hls:" + ev);
            });
          });
          hls.on(window.Hls.Events.MANIFEST_LOADED, function () {
            setStatus("Mode: hls.js (Chrome/Firefox)\nManifest loaded. Buffering...");
          });
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
            setStatus("Mode: hls.js (Chrome/Firefox)\nManifest parsed. Starting playback...");
            video.play().catch(function (e) { showErr("Autoplay blocked: " + e); });
          });
        };
        s.onerror = function () {
          showErr("Failed to load /js/hls.min.js. Run: docker compose ... --profile tools run --rm fetch-hlsjs");
        };
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
