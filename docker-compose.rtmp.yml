services:
  rtmp-server:
    image: alfg/nginx-rtmp
    container_name: s23-rtmp
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./configs/nginx/rtmp.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - rave-net

  streamer:
    environment:
      - OUTPUT_MODE=rtmp
      - RTMP_URL=rtmp://rtmp-server:1935/live/stream
    depends_on:
      - rtmp-server

networks:
  rave-net:
    driver: bridge
