services:
  rtmp-server:
    # Pinned 2026-08-02, same image and reasoning as rtmp-ingest in
    # docker-compose.yml: v1.6.0 carries latest's digest.
    image: alfg/nginx-rtmp:v1.6.0
    container_name: s23-rtmp
    ports:
      - "8080:80"
    volumes:
      - ./configs/nginx/rtmp.conf:/etc/nginx/nginx.conf
    # Unlike the ingest container this config DOES declare an http server on 80
    # (rtmp.conf), so an HTTP probe is meaningful here — but it has to be /stat,
    # not /. The server's root (/www/static) ships crossdomain.xml, player.html
    # and stat.xsl and no index, and there is no `index` directive, so / is a
    # permanent 403 and busybox wget exits non-zero on it: the healthcheck would
    # have reported this container unhealthy forever. Live-probed in the
    # container with rtmp.conf mounted: / -> 403, /stat -> 200. /stat also
    # exercises rtmp_stat, so it fails if the rtmp module is not actually up.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/stat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - rave-net

  streamer:
    environment:
      - OUTPUT_MODE=rtmp
      - RTMP_URL=rtmp://rtmp-server:1935/live/stream
    depends_on:
      - rtmp-server

networks:
  rave-net:
    driver: bridge
